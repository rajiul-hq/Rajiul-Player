<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speakeasy – Talk your way to fluent English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F5;--sf:#F0EEE6;--tx:#141413;--mu:#6d6b63;--ln:#14141318;
--cl:#D97757;--kr:#D4A27F;--ol:#788C5D;--sk:#6A9BCC;--mn:#EBDBBC;
--fd:'Newsreader',Georgia,serif;--fb:'Hanken Grotesk',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141413;--sf:#201f1d;--tx:#FAF9F5;--mu:#a9a79d;--ln:#faf9f522}}
:root[data-theme=dark]{--bg:#141413;--sf:#201f1d;--tx:#FAF9F5;--mu:#a9a79d;--ln:#faf9f522}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.02;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cl);outline-offset:3px}[hidden]{display:none!important}
svg{display:block}
@keyframes rv{from{opacity:0;transform:translateY(18px)}}@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}@keyframes rot{to{transform:rotate(1turn)}}
.rv{animation:rv .8s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}
.A{fill:#141413}.B{fill:#FAF9F5}.S{stroke:#141413;fill:none;stroke-width:6;stroke-linecap:round}
.cta{width:100%;height:60px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:600;font-size:1rem;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 28px;transition:.4s var(--ease)}
.cta b{width:44px;height:44px;border-radius:50%;background:var(--cl);color:#141413;display:grid;place-items:center;transition:transform .4s var(--ease)}.cta svg{width:20px}
.cta:active b{transform:translateX(5px)}.cta:disabled{opacity:.3;cursor:not-allowed}
/* ===== onboarding chat ===== */
#ob{position:fixed;left:0;right:0;top:0;height:100%;z-index:30;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
#ob:before{content:"";position:absolute;width:120vw;aspect-ratio:1;right:-60vw;top:-60vw;border-radius:50%;background:var(--cl);opacity:.14;pointer-events:none}
.obw{position:relative;height:100%;max-width:540px;margin:auto;display:flex;flex-direction:column}
.obh{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;height:56px}
.bk{width:40px;height:40px;margin-left:-10px;display:grid;place-items:center}.bk svg{width:22px}
.brand{display:flex;align-items:center;gap:9px;font:italic 500 1.4rem var(--fd)}
.brand i{width:30px;height:30px;border-radius:50% 50% 50% 6px;background:var(--cl);display:grid;place-items:center;font:normal 500 1rem var(--fd);color:#141413}
.dots{display:flex;gap:6px;width:40px;justify-content:flex-end}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ln);transition:.4s}.dots i.on{background:var(--cl);transform:scale(1.2)}
.chat{flex:1;overflow-y:auto;scrollbar-width:none;padding:16px 20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.chat:before{content:"";margin-top:auto}
.m{display:flex;gap:10px;align-items:flex-end;max-width:92%;animation:rv .5s var(--ease)}
.m .av{width:30px;height:30px;border-radius:50% 50% 50% 6px;background:var(--cl);color:#141413;display:grid;place-items:center;font:500 1rem var(--fd);flex:none}
.m.h p{background:var(--sf);padding:14px 18px;border-radius:22px 22px 22px 6px;font:400 clamp(1.35rem,5.4vw,1.65rem)/1.18 var(--fd);letter-spacing:-.01em}
.m.h p span{animation:fi .5s backwards}
.m.u{align-self:flex-end}.m.u p{background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:22px 22px 6px 22px;font:italic 500 1.5rem var(--fd)}
.ty p{display:flex;gap:5px;padding:18px 20px}.ty b{width:8px;height:8px;border-radius:50%;background:var(--mu);animation:bn 1s infinite}.ty b:nth-child(2){animation-delay:.15s}.ty b:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px);opacity:.4}}
.dock{padding:6px 20px calc(18px + env(safe-area-inset-bottom,0px));min-height:12px;opacity:0;transform:translateY(20px);transition:.5s var(--ease)}.dock.in{opacity:1;transform:none}
.cmp{display:flex;gap:10px;align-items:center;background:var(--sf);border-radius:99px;padding:6px 6px 6px 22px;box-shadow:inset 0 0 0 1.5px var(--ln);transition:box-shadow .3s}.cmp:focus-within{box-shadow:inset 0 0 0 2px var(--cl)}
.cmp input{flex:1;min-width:0;background:none;border:0;outline:0;height:48px;font:400 1.35rem var(--fd);color:var(--tx)}.cmp input::placeholder{color:var(--mu);font-style:italic}
.snd{width:48px;height:48px;border-radius:50%;background:var(--cl);color:#141413;display:grid;place-items:center;transition:.3s var(--ease);flex:none}.snd svg{width:22px}.snd:disabled{background:var(--ln);color:var(--mu)}.snd:not(:disabled):active{transform:scale(.9)}
.opts{display:grid;gap:8px}
.op{display:grid;grid-template-columns:44px 1fr 22px;gap:14px;align-items:center;text-align:left;padding:10px 16px 10px 10px;border-radius:22px;background:var(--sf);box-shadow:inset 0 0 0 1.5px transparent;transition:.35s var(--ease)}
.op:active{transform:scale(.98)}.op.on{box-shadow:inset 0 0 0 2px var(--c)}
.sw{width:44px;height:44px;border-radius:14px;background:var(--c);display:grid;place-items:center}.sw svg{width:28px}
.op b{display:block;font-weight:600;font-size:1rem;line-height:1.2}.op small{display:block;color:var(--mu);font-size:.82rem;line-height:1.3}.op em{display:block;font:italic 1.02rem/1.2 var(--fd);margin-top:2px}
.op u{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ln);transition:.3s var(--ease)}.op.on u{box-shadow:inset 0 0 0 7px var(--c)}
.pk{background:var(--sf);border-radius:26px;padding:8px 12px 14px}
.dob{position:relative}.dob:before{content:"";position:absolute;left:0;right:0;top:50%;height:44px;margin-top:-22px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--cl);pointer-events:none}
.wheels{display:grid;grid-template-columns:.8fr 1.6fr 1fr;height:220px;position:relative;-webkit-mask:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wh{overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;scrollbar-width:none;text-align:center;overscroll-behavior:contain}.wh::-webkit-scrollbar{display:none}
.wh div{height:44px;line-height:44px;scroll-snap-align:center;font:500 1.6rem var(--fd);cursor:pointer;opacity:.2;white-space:nowrap}
.dbi{text-align:center;color:var(--mu);font-size:.92rem;margin:4px 0 12px}.dbi b{font:500 1.5rem var(--fd);color:var(--tx);margin-right:4px}
.tg{display:flex;gap:16px;align-items:center;padding:18px;border-radius:22px;background:var(--sf);margin-bottom:12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.tg input{position:absolute;opacity:0;pointer-events:none}.tg a{color:var(--tx);font-weight:600;text-underline-offset:3px}
.bx{width:32px;height:32px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 2px var(--ln);display:grid;place-items:center;transition:.3s var(--ease)}
.bx svg{width:20px}.bx path{fill:none;stroke:#141413;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .1s}
.tg input:checked+.bx{background:var(--cl);box-shadow:none;transform:scale(1.08)}.tg input:checked+.bx path{stroke-dashoffset:0}.tg input:focus-visible+.bx{outline:2px solid var(--cl);outline-offset:3px}
/* ===== referral sheet ===== */
.mo{position:fixed;inset:0;background:#14141388;backdrop-filter:blur(3px);display:grid;align-items:end;z-index:50;animation:fi .3s}
.sheet{background:var(--bg);border-radius:30px 30px 0 0;padding:30px 22px calc(20px + env(safe-area-inset-bottom,0px));max-width:540px;width:100%;margin:auto auto 0;display:grid;gap:20px;animation:up .6s var(--ease)}
.sheet h2{font-size:clamp(2.2rem,9vw,2.8rem)}.sheet p{color:var(--mu);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:12px 18px;border-radius:99px;background:var(--sf);font-weight:500;font-size:.95rem;transition:.3s var(--ease);white-space:nowrap}
.chip.on{background:var(--cl);color:#141413}
.skip{text-align:center;color:var(--mu);font-size:.9rem;padding:4px}
@media(min-width:600px){.mo{align-items:center}.sheet{border-radius:30px;margin:auto}}
/* ===== app ===== */
#app{max-width:1000px;margin:auto;padding:0 20px 130px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 0}
.wm{font:italic 500 1.5rem var(--fd);display:flex;align-items:center;gap:9px}.wm i{width:28px;height:28px;border-radius:50% 50% 50% 6px;background:var(--cl);display:grid;place-items:center;font:normal 500 .95rem var(--fd);color:#141413}
.pill{background:var(--sf);padding:7px 14px;border-radius:99px;font-size:.84rem;font-weight:600}
.hi{margin:30px 0 0;color:var(--mu);font-weight:500}.hl{font-size:clamp(2.7rem,12vw,4.6rem);margin-top:4px}.hl i{color:var(--cl)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:2px;padding:6px;border-radius:99px;background:var(--tx);box-shadow:0 14px 40px #14141344}
.nav button{height:48px;padding:0 16px;border-radius:99px;color:var(--bg);opacity:.62;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;transition:.4s var(--ease)}
.nav svg{width:22px}.nav span{display:none}.nav .on{background:var(--cl);color:#141413;opacity:1;padding:0 20px}.nav .on span{display:inline}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 16px}.sec h2{font-size:1.9rem}.sec button{color:var(--mu);font-size:.88rem;font-weight:600}
.tl{--tb:var(--cl);display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%;aspect-ratio:1/1.08;padding:18px;border-radius:28px;background:var(--tb);color:#141413;position:relative;overflow:hidden;transition:transform .5s var(--ease)}
.tl:active{transform:scale(.97)}
.tl .art{position:absolute;right:-8%;bottom:-8%;width:74%;pointer-events:none}
.tt{position:relative;display:block}.tt small{font-size:.74rem;font-weight:600;opacity:.7}.tt h3{font-size:clamp(1.5rem,6vw,1.9rem);line-height:1;margin-top:5px;max-width:11ch;hyphens:auto}
.tf{position:relative;display:flex;align-items:center;gap:8px}.tf em{font-style:normal;font-size:.72rem;font-weight:600;background:#faf9f5c4;padding:4px 10px;border-radius:99px}
.dn{width:22px;height:22px;border-radius:50%;background:#141413;color:#FAF9F5;display:grid;place-items:center}.dn svg{width:13px}
.pg{position:absolute;left:0;bottom:0;height:5px;background:#141413}
.hero{aspect-ratio:auto;min-height:330px;margin-top:22px;padding:24px;border-radius:34px}
.hero .art{width:68%}.hero h3{font-size:clamp(2.6rem,12vw,4.2rem);max-width:8ch;line-height:.95}
.hero .tt small{font-size:.82rem}.hero .tf em{font-size:.82rem;padding:6px 14px}
.hero .pb{position:absolute;left:24px;bottom:72px;width:60px;height:60px;border-radius:50%;background:#141413;color:#FAF9F5;display:grid;place-items:center}.pb svg{width:22px;margin-left:3px}
.hero .tf{margin-top:auto}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.rail .tl{width:170px;flex:none;scroll-snap-align:start}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
@media(min-width:760px){.gr{grid-template-columns:repeat(4,1fr)}.rail .tl{width:210px}}
.goal{display:flex;gap:18px;align-items:center;margin-top:30px;padding:20px;border-radius:28px;background:var(--sf)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--cl) calc(var(--p)*1%),var(--ln) 0);padding:8px;flex:none}
.ring b{width:100%;height:100%;border-radius:50%;background:var(--sf);display:grid;place-items:center;font:500 1.7rem var(--fd)}
.goal h3{font-size:1.5rem}.goal p{color:var(--mu);font-size:.9rem;margin-top:4px}
.wk{display:flex;justify-content:space-between;margin-top:14px}
.wk div{display:grid;justify-items:center;gap:8px;font-size:.76rem;font-weight:600;color:var(--mu)}
.wk i{width:36px;height:36px;border-radius:50%;background:var(--sf);display:grid;place-items:center;transition:.4s}
.wk .d i{background:var(--cl)}.wk .d i:after{content:"";width:8px;height:8px;border-radius:50%;background:#141413}.wk .t{color:var(--tx)}
.topics{display:flex;flex-wrap:wrap;gap:9px}
.tp{display:flex;align-items:center;gap:9px;padding:11px 16px 11px 12px;border-radius:99px;background:var(--sf);font-weight:500;font-size:.93rem}.tp i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.sr{position:relative;margin:20px 0 6px}.sr svg{position:absolute;left:20px;top:18px;width:22px;color:var(--mu)}
.sr input{width:100%;height:58px;border-radius:99px;border:0;background:var(--sf);padding:0 20px 0 52px;font-size:1.05rem;outline:0;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .3s}.sr input:focus{box-shadow:inset 0 0 0 2px var(--cl)}.sr input::placeholder{color:var(--mu)}
.fl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -20px 0;padding:0 20px}.fl::-webkit-scrollbar{display:none}
.fl button{padding:9px 16px;border-radius:99px;color:var(--mu);white-space:nowrap;font-weight:600;font-size:.88rem;box-shadow:inset 0 0 0 1.5px var(--ln);transition:.3s}.fl .on{background:var(--tx);color:var(--bg);box-shadow:none}
.empty{text-align:center;padding:60px 0;color:var(--mu);grid-column:1/-1}.empty h3{font-size:2.2rem;color:var(--tx);font-style:italic;margin-bottom:8px}
.lk{color:var(--tx);font-weight:600;text-decoration:underline;text-underline-offset:4px;margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.facts div{padding:16px;border-radius:22px;background:var(--sf)}.facts b{display:block;font:500 2.3rem/1 var(--fd)}.facts span{font-size:.78rem;color:var(--mu);font-weight:500}
.bds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{display:grid;justify-items:center;gap:8px;text-align:center;font-size:.8rem;font-weight:600}.bd i{width:64px;height:64px;border-radius:50%;background:var(--sf);display:grid;place-items:center;color:var(--mu)}.bd i svg{width:28px}
.bd.on i{background:var(--c);color:#141413}.bd:not(.on){opacity:.55}
.set{display:flex;gap:24px}.set button{color:var(--mu);text-decoration:underline;text-underline-offset:4px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:99px;z-index:90;font-weight:600;font-size:.9rem;animation:rv .5s var(--ease);white-space:nowrap}
/* ===== player ===== */
#pl{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--tx);overflow-y:auto;animation:fi .3s;padding-top:env(safe-area-inset-top,0px)}
.pw{max-width:980px;margin:auto}
.stage{position:sticky;top:0;z-index:2;aspect-ratio:16/10;background:var(--tb);color:#141413;overflow:hidden;user-select:none;touch-action:manipulation;max-height:72vh;margin:auto;border-radius:0 0 32px 32px}
.stage:fullscreen{max-height:none;aspect-ratio:auto;border-radius:0}
.stage .art{position:absolute;right:-10%;bottom:-18%;width:60%;opacity:.9;animation:fl 8s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-12px) rotate(4deg)}}
.scene{position:absolute;inset:0;display:flex;align-items:center;padding:0 9%}
.cap{font:500 clamp(1.8rem,7.4vw,3.8rem)/1 var(--fd);max-width:12ch;letter-spacing:-.025em;position:relative;margin-top:-6%}
.cap span{display:inline-block;animation:rv .6s var(--ease) backwards}
.cc{position:absolute;left:0;right:0;bottom:78px;text-align:center;padding:0 8%;z-index:1;pointer-events:none}
.cc span{background:#141413d8;color:#FAF9F5;padding:4px 12px;border-radius:8px;font-size:clamp(.78rem,2.6vw,1.05rem)}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .35s;z-index:3}
.ctl.h{opacity:0}.ctl.h *{pointer-events:none}.ctl button{color:#141413}
.tr,.br{display:flex;align-items:center;padding:10px 12px;gap:6px}.tr{justify-content:space-between}
.tr span{font:italic 500 1.2rem var(--fd);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mid{display:flex;justify-content:center;align-items:center;gap:clamp(22px,9vw,60px);margin-top:-10px}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}.ib svg{width:24px;height:24px}.ib:active{background:#14141322}
.ib.pp{width:72px;height:72px;background:#141413;color:#FAF9F5!important;transition:transform .3s var(--ease)}.ib.pp:active{transform:scale(.92)}.ib.pp svg{width:28px}
.seek{flex:1;height:38px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.sk{position:relative;width:100%;height:5px;border-radius:9px;background:#14141330;transition:height .2s}.seek:hover .sk,.seek.d .sk{height:8px}
.sk i{position:absolute;left:0;top:0;bottom:0;background:#141413;border-radius:9px}
.sk u{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#FAF9F5;box-shadow:0 0 0 3px #141413}
.tm{font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.spd{font-weight:700;font-size:.82rem;min-width:44px;height:44px}
.ld{position:absolute;inset:0;display:grid;place-items:center;background:var(--tb);z-index:4;align-content:center;justify-items:center;gap:14px}
.sp{width:46px;height:46px;border-radius:50%;border:4px solid #14141322;border-top-color:#141413;animation:rot .8s linear infinite}
.ld small{font:italic 500 1.3rem var(--fd)}
.fx{position:absolute;top:50%;margin-top:-34px;width:68px;height:68px;border-radius:50%;background:#14141322;display:grid;place-items:center;z-index:2;font-size:.85rem;font-weight:700;animation:fo .6s forwards;pointer-events:none}@keyframes fo{to{opacity:0;transform:scale(1.35)}}
.info{padding:24px 20px 80px}.meta{display:flex;gap:8px;flex-wrap:wrap}.meta span{background:var(--sf);padding:6px 13px;border-radius:99px;font-size:.8rem;font-weight:600}
.info h1{font-size:clamp(2.6rem,11vw,4rem);margin:16px 0 10px}.info .sb{color:var(--mu)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.pn button{height:54px;border-radius:99px;background:var(--sf);font-weight:600;font-size:.92rem}.pn button:last-child{background:var(--tb);color:#141413}.pn button:disabled{opacity:.3}
.lines{display:grid;gap:2px}
.lines button{text-align:left;padding:12px 0;color:var(--mu);font:400 1.65rem/1.3 var(--fd);transition:color .4s}
.lines .on{color:var(--tx)}.lines button span{background:linear-gradient(transparent 62%,transparent 62%);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .5s}
.lines .on span{background:linear-gradient(transparent 58%,var(--tb) 58%);font-style:italic}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>
.stage{aspect-ratio:16/9;background:#000;color:#FAF9F5;border-radius:0 0 28px 28px}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ctl{background:linear-gradient(#000b,#0000 30%,#0000 50%,#000d)}
.ctl button,.tr span,.tm{color:#FAF9F5}.ib:active{background:#fff3}
.ib.pp{background:#FAF9F5;color:#141413!important}
.sk{background:#faf9f533}.sk i{background:var(--cl);z-index:1}.sk u{background:#FAF9F5;box-shadow:0 0 0 3px var(--cl);z-index:2}
